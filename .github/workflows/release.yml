name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify release version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/.*version: "\([^"]*\)".*/\1/p' mix.exs | head -1)
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match application version ${version}" >&2
            exit 1
          }
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
          image=$(printf 'ghcr.io/%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

  build-cli:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3

      - name: Build CLI artifacts
        env:
          MIX_ENV: prod
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          mix deps.get --only prod
          for target in linux_x86_64 linux_aarch64 macos_x86_64 macos_aarch64 windows_x86_64; do
            BURRITO_TARGET=${target} mix release opsonde --overwrite
          done
          for path in burrito_out/opsonde_*; do
            target=${path#burrito_out/opsonde_}
            mv "${path}" "burrito_out/opsonde-${VERSION}-${target}"
          done
          cd burrito_out
          sha256sum opsonde-* > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: opsonde-${{ needs.version.outputs.value }}-cli
          path: burrito_out/
          if-no-files-found: error

  validate-cli:
    needs: [version, build-cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_x86_64
          - runner: ubuntu-24.04-arm
            target: linux_aarch64
          - runner: macos-15-intel
            target: macos_x86_64
          - runner: macos-15
            target: macos_aarch64
          - runner: windows-2025
            target: windows_x86_64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: opsonde-${{ needs.version.outputs.value }}-cli
          path: burrito_out

      - name: Run CLI on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.value }}
          TARGET: ${{ matrix.target }}
        run: |
          binary="burrito_out/opsonde-${VERSION}-${TARGET}"
          chmod +x "${binary}"
          "${binary}" --help | tee help.txt
          grep -q '^Usage:' help.txt

      - name: Run CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.value }}
          TARGET: ${{ matrix.target }}
        run: |
          & ".\burrito_out\opsonde-$env:VERSION-$env:TARGET" --help | Tee-Object help.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path help.txt -Pattern '^Usage:')) { exit 1 }

  publish:
    needs: [version, validate-cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: opsonde-${{ needs.version.outputs.value }}-cli
          path: burrito_out

      - name: Publish CLI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" burrito_out/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" burrito_out/* \
              --title "Opsonde ${VERSION}" --generate-notes
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: OPSONDE_VERSION=${{ needs.version.outputs.value }}
          tags: |
            ${{ needs.version.outputs.image }}:${{ needs.version.outputs.value }}
            ${{ needs.version.outputs.image }}:latest
