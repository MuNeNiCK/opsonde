name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl autoconf automake libtool pkg-config libssl-dev
          mix deps.get
          mix assets.setup
      - name: Verify source
        env:
          MIX_ENV: test
        run: |
          mix ash.codegen --check
          mix precommit
          mix cmd --cd assets corepack pnpm exec vp test
          cargo fmt --manifest-path native/ipmi_nif/Cargo.toml --check
      - name: Verify CLI composition
        env:
          MIX_ENV: cli
        run: |
          mix compile --warnings-as-errors
          mix run --no-halt -- --help > cli-help.txt
          grep -q '^Usage:' cli-help.txt
